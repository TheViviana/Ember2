name: release-windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 目标 Release 标签（留空则只产出可下载的 Artifact，不碰任何 Release）
        required: false
        default: ''
      ref:
        description: 构建使用的 Git ref（发布时建议填对应 tag）
        required: false
        default: main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 有证书 secret 才导入并签名；没有则产出未签名安装包（SmartScreen 需手动放行）。
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile

      # 代码签名证书：base64 的 PFX 写入临时文件后导入 CurrentUser\My，
      # 只把 Thumbprint 传给 tauri（证书本身不落工作区）。
      - name: Import code signing certificate
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # updater 产物必须有签名私钥；缺失时直接失败，避免悄悄产出无法自动更新的包。
      - name: Write release build config
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_SIGNING_KEY" != "true" ]]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY secret，无法生成 Windows updater 签名"
            exit 1
          fi
          config="$RUNNER_TEMP/tauri.release.conf.json"
          if [[ -n "${WINDOWS_CERT_THUMBPRINT:-}" ]]; then
            printf '{"bundle":{"createUpdaterArtifacts":true,"windows":{"certificateThumbprint":"%s","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}' \
              "$WINDOWS_CERT_THUMBPRINT" > "$config"
          else
            printf '{"bundle":{"createUpdaterArtifacts":true}}' > "$config"
          fi
          echo "TAURI_BUILD_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Build NSIS installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis --config "$TAURI_BUILD_CONFIG"

      - name: List bundle output
        shell: bash
        run: ls -lh src-tauri/target/release/bundle/nsis/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ember-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer to release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.tag }}" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/nsis/*.exe.sig \
            --clobber
