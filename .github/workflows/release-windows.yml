name: release-windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 目标 Release 标签（留空则只产出可下载的 Artifact，不碰任何 Release）
        required: false
        default: ''
      ref:
        description: 构建使用的 Git ref
        required: false
        default: main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
      - name: List bundle output
        shell: bash
        run: ls -lh src-tauri/target/release/bundle/nsis/
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ember-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload installer to release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.tag }}" src-tauri/target/release/bundle/nsis/*.exe --clobber
