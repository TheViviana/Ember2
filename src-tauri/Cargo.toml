[package]
name = "ember"
version = "1.2.1"
edition = "2021"
rust-version = "1.85"
description = "Ember 本地优先知识工作台的宿主进程"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "ember_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

# P0 仅保持可编译的最小依赖集；vault/ai/library 模块依赖按 PLAN.md §6 P1 引入，
# 版本与审计结果见 docs/changes/CR-20261115-01.md。
[dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# 库变更监听（macOS FSEvents 后端由 default 特性启用）
notify = "8.2.2"
# 原子写校验、备份复核、媒体内容寻址去重
sha2 = "0.10.9"
# IPC 错误类型（与树内既有 1.0.69 同版本，不引入第三版本）
thiserror = "1.0.69"
# AI 传输层：macOS 走 security-framework，不引 openssl
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "query"] }
# SSE 取消竞速与定时（运行时由 reqwest 传递依赖提供，此处只补宏与 time）
tokio = { version = "1.54.1", default-features = false, features = ["macros", "time"] }
# 库身份 ULID（成熟实现，不自写）
ulid = "3.0.0"
# T13 CR-A 补充：系统文件夹选择器（仅目录选择 open，不给 save/message/confirm）
tauri-plugin-dialog = "=2.6.0"
# P7：应用内自动更新（占位 endpoint/pubkey，真实发布前必须替换，见 docs/updater.md）
tauri-plugin-updater = "=2.14.1"

# 系统回收站：NSFileManager.trashItemAtURL（vault/trash.rs），只开用到的方法所需 feature
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSError", "NSString", "NSValue"] }

# 系统回收站：SHFileOperationW（vault/windows.rs），只开 Shell 与 Foundation 所需 feature
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_UI_Shell"] }

[dev-dependencies]
# 测试隔离临时目录（不向真实库写入测试文件）
tempfile = "3.27.0"
# 双线路竞速单测：暂停时钟与 current-thread 运行时仅在测试构建启用
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "test-util", "time"] }

# P7：macOS 27 / Xcode 27 环境下 release 默认的 `-C strip=debuginfo` 会产出
# 损坏的 proc-macro dylib（dlopen 报 "mis-aligned LINKEDIT string pool"），
# 导致 `phf_macros` / `serde_derive` 等无法加载。显式关闭 strip 规避；
# 体积代价可接受，发布包仍由 DMG 压缩。
[profile.release]
strip = "none"
